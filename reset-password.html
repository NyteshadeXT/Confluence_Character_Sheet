<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password · Confluence Character</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-auth.js"></script>
<script src="neon-config.js"></script>
<script src="neon-bootstrap.js"></script>
<script src="confluence-auth.js"></script>
</head>
<body>
<div class="app auth-shell"><section class="panel auth-card">
<div class="eyebrow">CONFLUENCE CHARACTER</div>
<h1>Choose a New Password</h1>
<p class="muted">Enter and confirm your new account password.</p>
<section id="resetForm">
<label>New Password <input id="newPassword" type="password" autocomplete="new-password" minlength="12"></label>
<label>Confirm Password <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12"></label>
<button id="resetSubmit" class="primary wide" type="button">Set New Password</button>
</section>
<div id="notice" class="status" role="status"></div>
<p><a id="loginLink" href="/login.html?backend=neon">Return to Sign In</a></p>
</section></div>
<script>
const params=new URLSearchParams(location.search);
const hashParams=new URLSearchParams(location.hash.slice(1));
const token=params.get('token')||hashParams.get('token');
const backend=params.get('backend')||window.CONFLUENCE_BACKEND_PROVIDER;
loginLink.href='/login.html'+(backend==='neon'?'?backend=neon':'');
function show(message,bad=false){notice.textContent=message;notice.className='status '+(bad?'bad':'good');}
if(backend==='neon'&&!token){
  resetSubmit.disabled=true;
  show('This reset link is missing a token. Request a new link from the sign-in page.',true);
}
resetSubmit.onclick=async()=>{
  if(newPassword.value.length<12)return show('Use a password of at least 12 characters.',true);
  if(newPassword.value!==confirmPassword.value)return show('Passwords do not match.',true);
  resetSubmit.disabled=true;show('Updating password…');
  try{
    const result=await window.confluenceAuth.resetPassword(token,newPassword.value);
    if(result?.error)throw result.error;
    resetForm.hidden=true;
    show('Password updated. You can now sign in with your new password.');
  }catch(error){show(error.message||String(error),true);resetSubmit.disabled=false;}
};
</script>
</body>
</html>
