<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confluence Character — Signing In</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-auth.js"></script>
<script src="neon-config.js"></script>
<script src="neon-bootstrap.js"></script>
<script src="confluence-auth.js"></script>
</head>
<body>
<div class="app auth-shell"><section class="panel auth-card"><div class="eyebrow">CONFLUENCE CHARACTER</div><h1>Signing in…</h1><div id="notice" class="status">Completing authentication.</div></section></div>
<script>
(async()=>{
 const next=new URLSearchParams(location.search).get('next')||'/';
 for(let i=0;i<20;i++){
  try{const session=await window.confluenceAuth.getSession();if(session){location.replace(next);return}}catch(e){}
  await new Promise(r=>setTimeout(r,250));
 }
 document.getElementById('msg').textContent='Sign-in could not be completed. Return to login and try again.';
})();
</script>
</body>
</html>
