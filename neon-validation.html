<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confluence Neon Validation</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#111;color:#eee}
.card{background:#1b1b1b;border:1px solid #444;border-radius:10px;padding:18px;margin:14px 0}
.ok{color:#7ee787}.bad{color:#ff7b72}.muted{color:#aaa}pre{white-space:pre-wrap;word-break:break-word}
button{padding:9px 14px;margin-right:8px}
</style>
<script>window.CONFLUENCE_BACKEND_PROVIDER='supabase';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script><script src="/supabase-auth.js"></script>
<script src="/neon-config.js"></script><script src="/neon-bootstrap.js"></script>
<script src="/confluence-auth.js"></script><script src="/confluence-api.js"></script>
</head>
<body>
<h1>Neon Validation</h1>
<p class="muted">Read-only browser validation for Auth → JWT → Data API → RLS/RPC.</p>
<div class="card"><b>Provider:</b> <span id="provider"></span></div>
<div class="card"><b>Session:</b><pre id="session">Checking…</pre></div>
<div class="card"><b>JWT metadata:</b><pre id="jwt">Waiting…</pre></div>
<div class="card"><b>Identity/RLS RPC:</b><pre id="rpc">Waiting…</pre></div>
<button id="login">Go to Login</button><button id="signout">Sign Out</button>
<script>
(async()=>{
 const out=(id,v,ok)=>{const e=document.getElementById(id);e.textContent=typeof v==='string'?v:JSON.stringify(v,null,2);e.className=ok?'ok':'bad'};
 document.getElementById('provider').textContent=window.confluenceAuth.provider;
 try{
   const session=await window.confluenceAuth.getSession();
   out('session',session?{authenticated:true,user:session.user?{id:session.user.id,email:session.user.email}:null}:{authenticated:false},!!session);
   if(session){
     try {
       const authClient=window.CONFLUENCE_NEON_AUTH_CLIENT;
       const tokenResult=authClient && authClient.getAccessToken ? await authClient.getAccessToken() : null;
       const token=typeof tokenResult==='string' ? tokenResult :
         (tokenResult && tokenResult.data && (tokenResult.data.token || tokenResult.data.accessToken)) ||
         (tokenResult && (tokenResult.token || tokenResult.accessToken)) || null;
       if(token && token.split('.').length===3){
         const dec=(part)=>JSON.parse(decodeURIComponent(escape(atob(part.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(part.length/4)*4,'=')))));
         const parts=token.split('.'), header=dec(parts[0]), payload=dec(parts[1]);
         out('jwt',{header:{alg:header.alg,kid:header.kid,typ:header.typ},claims:{iss:payload.iss,aud:payload.aud,sub:payload.sub,role:payload.role,iat:payload.iat,exp:payload.exp}},true);
       } else {
         out('jwt',{note:'No JWT exposed by auth.getAccessToken(); combined SDK should still forward its cached token automatically.'},true);
       }
     } catch(e){ out('jwt',{diagnosticError:e.message||String(e)},false); }
     const r=await window.confluenceApi.rpc('is_system_gm',{});
     out('rpc',r,!r.error);
   } else { out('jwt','Sign in first.',false); out('rpc','Sign in first.',false); }
 }catch(e){out('session',e.message||String(e),false)}
 document.getElementById('login').onclick=()=>location.href='/login.html?backend=neon&next='+encodeURIComponent('/neon-validation.html?backend=neon');
 document.getElementById('signout').onclick=async()=>{await window.confluenceAuth.signOut();location.reload()};
})();
</script>
</body></html>
