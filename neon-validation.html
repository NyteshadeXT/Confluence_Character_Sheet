<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confluence Neon Validation</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#111;color:#eee}
.card{background:#1b1b1b;border:1px solid #444;border-radius:10px;padding:18px;margin:14px 0}
.ok{color:#7ee787}.bad{color:#ff7b72}.muted{color:#aaa}pre{white-space:pre-wrap;word-break:break-word}
button{padding:9px 14px;margin-right:8px}
</style>
<script>window.CONFLUENCE_BACKEND_PROVIDER='supabase';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script><script src="/supabase-auth.js"></script>
<script src="/neon-config.js"></script>
<script>
(function(){
  const originalFetch = window.fetch.bind(window);
  window.__CONFLUENCE_DIAGNOSTIC_ORIGINAL_FETCH = originalFetch;
  window.__CONFLUENCE_DATA_API_DIAGNOSTIC = { observed: false, jwt: null, note: null };

  function b64json(part){
    const normalized=part.replace(/-/g,'+').replace(/_/g,'/');
    const padded=normalized.padEnd(Math.ceil(normalized.length/4)*4,'=');
    return JSON.parse(decodeURIComponent(Array.prototype.map.call(atob(padded),c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  }
  function summarizeJwt(token){
    if(!token || token.split('.').length!==3) return null;
    const parts=token.split('.'), header=b64json(parts[0]), payload=b64json(parts[1]);
    return {
      header:{alg:header.alg||null,kid:header.kid||null,typ:header.typ||null},
      claims:{
        iss:payload.iss||null,aud:payload.aud||null,sub:payload.sub||null,
        role:payload.role||null,iat:payload.iat||null,exp:payload.exp||null
      }
    };
  }
  function authorizationFrom(input,init){
    let value=null;
    try{
      if(init && init.headers) value=new Headers(init.headers).get('authorization');
      if(!value && input instanceof Request) value=input.headers.get('authorization');
    }catch(_){}
    return value;
  }

  window.fetch=async function(input,init){
    const url=typeof input==='string'?input:(input && input.url)||'';
    const dataApiUrl=(window.CONFLUENCE_NEON && window.CONFLUENCE_NEON.dataApiUrl)||'';
    if(dataApiUrl && url.startsWith(dataApiUrl)){
      const d=window.__CONFLUENCE_DATA_API_DIAGNOSTIC;
      d.observed=true;
      const auth=authorizationFrom(input,init);
      if(auth && /^Bearer\s+/i.test(auth)){
        try{
          d.jwt=summarizeJwt(auth.replace(/^Bearer\s+/i,''));
          d.note=d.jwt ? null : 'Authorization header was present but was not a three-part JWT.';
        }catch(e){
          d.note='JWT metadata decode failed: '+(e.message||String(e));
        }
      }else{
        d.note='Data API request was observed, but no Bearer Authorization header was visible.';
      }
    }
    return originalFetch(input,init);
  };
})();
</script>
<script src="/neon-bootstrap.js"></script>
<script src="/confluence-auth.js"></script><script src="/confluence-api.js"></script>
</head>
<body>
<h1>Neon Validation</h1>
<p class="muted">Read-only browser validation for Auth → JWT → Data API → RLS/RPC.</p>
<div class="card"><b>Provider:</b> <span id="provider"></span></div>
<div class="card"><b>Session:</b><pre id="session">Checking…</pre></div>
<div class="card"><b>Outgoing Data API JWT:</b><pre id="jwt">Waiting…</pre></div>
<div class="card"><b>Auth JWKS comparison:</b><pre id="jwks">Waiting…</pre></div>
<div class="card"><b>Identity/RLS RPC:</b><pre id="rpc">Waiting…</pre></div>
<button id="login">Go to Login</button><button id="signout">Sign Out</button>
<script>
(async()=>{
 const out=(id,v,ok)=>{const e=document.getElementById(id);e.textContent=typeof v==='string'?v:JSON.stringify(v,null,2);e.className=ok?'ok':'bad'};
 document.getElementById('provider').textContent=window.confluenceAuth.provider;
 try{
   const session=await window.confluenceAuth.getSession();
   out('session',session?{authenticated:true,user:session.user?{id:session.user.id,email:session.user.email}:null}:{authenticated:false},!!session);

   if(session){
     const r=await window.confluenceApi.rpc('is_system_gm',{});
     const captured=window.__CONFLUENCE_DATA_API_DIAGNOSTIC||{};
     out('jwt',{
       requestObserved:!!captured.observed,
       jwt:captured.jwt||null,
       note:captured.note||null
     },!!captured.observed && !!captured.jwt);

     try{
       const originalFetch=window.__CONFLUENCE_DIAGNOSTIC_ORIGINAL_FETCH||window.fetch;
       const jwksUrl=((window.CONFLUENCE_NEON && window.CONFLUENCE_NEON.authBaseUrl)||'').replace(/\/$/,'')+'/.well-known/jwks.json';
       const response=await originalFetch(jwksUrl,{credentials:'omit'});
       if(!response.ok) throw new Error('JWKS HTTP '+response.status);
       const body=await response.json();
       const kids=Array.isArray(body.keys)?body.keys.map(k=>k.kid).filter(Boolean):[];
       const tokenKid=captured.jwt && captured.jwt.header ? captured.jwt.header.kid : null;
       out('jwks',{
         jwksUrl:jwksUrl,
         publishedKids:kids,
         tokenKid:tokenKid,
         kidMatch:tokenKid ? kids.includes(tokenKid) : null
       },response.ok && !!tokenKid && kids.includes(tokenKid));
     }catch(e){
       out('jwks',{diagnosticError:e.message||String(e)},false);
     }
     out('rpc',r,!r.error);
   }else{
     out('jwt','Sign in first.',false); out('jwks','Sign in first.',false); out('rpc','Sign in first.',false);
   }
 }catch(e){out('session',e.message||String(e),false)}
 document.getElementById('login').onclick=()=>location.href='/login.html?backend=neon&next='+encodeURIComponent('/neon-validation.html?backend=neon');
 document.getElementById('signout').onclick=async()=>{await window.confluenceAuth.signOut();location.reload()};
})();
</script>
</body></html>
