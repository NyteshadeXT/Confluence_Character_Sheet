<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confluence Character Login</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-auth.js"></script>
<script src="neon-config.js"></script>
<script src="neon-bootstrap.js"></script>
<script src="confluence-auth.js"></script>
</head>
<body>
<div class="app auth-shell">
<section class="panel auth-card">
  <div class="eyebrow">CONFLUENCE CHARACTER · v0.4.5</div>
  <h1>Sign in</h1>
  <p class="muted">Sign in with your email and password, or create an account.</p>

  <div class="auth-tabs">
    <button class="auth-tab active" data-auth-tab="password">Password</button>
    <button class="auth-tab" data-auth-tab="register">Create Account</button>
  </div>

  <section id="passwordPanel" class="auth-panel">
    <label>Email
      <input id="passwordEmail" type="email" autocomplete="username" placeholder="you@example.com">
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    </label>
    <button id="passwordSignIn" class="primary wide">Sign In</button>
  </section>

  <section id="registerPanel" class="auth-panel hidden">
    <label>Name <input id="registerName" autocomplete="name" placeholder="Player name"></label>
    <label>Email <input id="registerEmail" type="email" autocomplete="email" placeholder="you@example.com"></label>
    <label>Password <input id="registerPassword" type="password" autocomplete="new-password" placeholder="Create password"></label>
    <label>Confirm Password <input id="registerConfirm" type="password" autocomplete="new-password" placeholder="Confirm password"></label>
    <button id="registerSubmit" class="primary wide">Create Account</button>
    <p class="field-help">Create a Neon account, then ask your GM to add your email to the campaign.</p>
  </section>

  <div id="notice" class="status">Your browser keeps your authenticated session so you normally stay signed in.</div>
</section>
</div>

<script>
function withAuthTimeout(promise, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error((label || 'Authentication request') + ' timed out after 15 seconds.')), 15000))
  ]);
}
const params=new URLSearchParams(location.search);
const next=params.get('next')||'/';
const nextParams=new URL(next,location.origin).searchParams;
const activeBackend=params.get('backend')||nextParams.get('backend')||window.CONFLUENCE_BACKEND_PROVIDER;

function withActiveBackend(url){
  const target=new URL(url,location.origin);
  if(activeBackend==='neon')target.searchParams.set('backend','neon');
  return target.pathname+target.search+target.hash;
}

function show(message,bad=false){
  notice.textContent=message;
  notice.className='status '+(bad?'bad':'good');
}
function setTab(tab){
  document.querySelectorAll('.auth-tab').forEach(b=>b.classList.toggle('active',b.dataset.authTab===tab));
  passwordPanel.classList.toggle('hidden',tab!=='password');
  registerPanel.classList.toggle('hidden',tab!=='register');
}
document.querySelectorAll('.auth-tab').forEach(b=>b.onclick=()=>setTab(b.dataset.authTab));
if(activeBackend!=='neon')document.querySelector('[data-auth-tab="register"]').hidden=true;
if(activeBackend==='neon')document.querySelector('.auth-card > .muted').textContent='Sign in or create an account using your email and password.';

registerSubmit.onclick=async()=>{
 const name=registerName.value.trim(),email=registerEmail.value.trim(),pwd=registerPassword.value;
 if(!name||!email||!pwd)return show('Name, email, and password are required.',true);
 if(pwd!==registerConfirm.value)return show('Passwords do not match.',true);
 registerSubmit.disabled=true;show('Creating account…');
 try{
  const result=await withAuthTimeout(window.confluenceAuth.signUp({name,email,password:pwd}),'Registration');
  if(result?.error)return show(result.error.message||String(result.error),true);
  const session=await window.confluenceAuth.getSession();
  if(session){location.href=withActiveBackend(next);return;}
  setTab('password');passwordEmail.value=email;
  show('Account created. Sign in with your email and password. If email verification is required, check your inbox first.');
 }catch(err){show(err.message||String(err),true)}finally{registerSubmit.disabled=false}
};

passwordSignIn.onclick=async()=>{
  const email=passwordEmail.value.trim(),pwd=password.value;
  if(!email||!pwd)return show('Enter both email and password.',true);
  passwordSignIn.disabled=true;
  show('Signing in…');
  try{
    const {data,error}=await withAuthTimeout(
      window.confluenceAuth.signInWithPassword({email,password:pwd}),
      'Sign-in'
    );
    passwordSignIn.disabled=false;
    if(error)return show(error.message||String(error),true);
    if(!data||!data.session)return show('Sign-in succeeded but no active session could be verified.',true);
    location.href=withActiveBackend(next);
  }catch(error){
    passwordSignIn.disabled=false;
    show(error.message||String(error),true);
  }
};


(async()=>{
  try{
    const session=await window.confluenceAuth.getSession();
    if(session)location.href=withActiveBackend(next);
  }catch(error){
    show(error.message||String(error),true);
  }
})();
</script>
</body>
</html>
