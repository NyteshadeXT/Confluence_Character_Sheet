<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Confluence Character Login</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><div class="app"><section class="panel" style="max-width:520px;margin:10vh auto"><div class="eyebrow">CONFLUENCE CHARACTER</div><h1>Sign in</h1><p class="muted">Enter your email and we'll send you a secure magic link.</p><div class="actions"><input id="email" type="email" placeholder="you@example.com" style="flex:1"><button id="send" class="primary">Send Magic Link</button></div><div id="notice" class="status">Authentication is handled by Supabase.</div></section></div><script>const client=supabase.createClient(window.CONFLUENCE_SUPABASE.url,window.CONFLUENCE_SUPABASE.publishableKey);const next=new URLSearchParams(location.search).get('next')||'/';send.onclick=async()=>{const {error}=await client.auth.signInWithOtp({email:email.value,options:{emailRedirectTo:location.origin+'/auth-callback.html?next='+encodeURIComponent(next)}});notice.textContent=error?error.message:'Magic link sent. Check your email.'}</script></body></html>
